[package]
name = "expat-difftest"
description = "Differential test harness: the safe expat port versus the libexpat C oracle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints.rust]
missing_docs = "deny"

[dependencies]
expat = { path = "../crates/expat", features = ["internal-api"] }
expat-oracle = { path = "../crates/expat-oracle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
