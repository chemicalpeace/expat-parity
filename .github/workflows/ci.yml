name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · debt · doc · deny · vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: scripts/debt-check.sh
      - run: scripts/verify-vendor.sh
      - run: python3 scripts/gen_tables.py --check
      - run: cargo doc --workspace --no-deps --all-features
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace --all-features
      - run: cargo test -p expat --no-default-features
      # D-033: the tracker's structure sizes against this platform's C
      # compiler, printed for the per-platform report.
      - name: tracker sizes vs C sizeof
        run: cargo test -p expat-difftest --test tracker_sizes -- --nocapture

  miri:
    name: miri (safe crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal -c miri,rust-src
      - run: cargo +nightly miri test -p expat --all-features
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  fuzz-smoke:
    name: fuzz smoke (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - run: scripts/fuzz-smoke.sh 60
