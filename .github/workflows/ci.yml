name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · debt · doc · deny · vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: scripts/debt-check.sh
      - run: scripts/verify-vendor.sh
      - run: python3 scripts/gen_tables.py --check
      - run: cargo doc --workspace --no-deps --all-features
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace --all-features
      - run: cargo test -p expat --no-default-features
      # D-034: the tracker's structure sizes against this platform's C
      # compiler and the DV-1 / R1 window boundaries, printed for the
      # per-platform report (both also run in the step above).
      - name: tracker sizes and DV-1 windows (per-platform report)
        run: cargo test --release -p expat-difftest --test tracker_sizes --test dv1_windows -- --nocapture
      # Q-5 (D-035): the declaration count of the C-differential test and
      # the two recorded seeded runs of the random test (195,000 cases),
      # printed per platform (docs/security/Q-5-...-overread.md).
      - name: Q-5 differential count and seeded random runs (per-platform report)
        shell: bash
        run: |
          cargo test --release -p expat-difftest --test xmldecl_unknown_diff -- --nocapture
          PROPTEST_CASES=100000 PROPTEST_RNG_SEED=11 cargo test --release -p expat-difftest --test init_diff -- --exact xml_decl_in_every_builtin_encoding
          PROPTEST_CASES=95000 PROPTEST_RNG_SEED=12 cargo test --release -p expat-difftest --test init_diff -- --exact xml_decl_in_every_builtin_encoding

  # Q-5: libexpat 2.9.0's over-read in unknown_toUtf8, reproduced with
  # sanitizers on every run (docs/evidence/q5). Apple clang has no
  # MemorySanitizer; MSVC is not set up for the sanitizer build.
  q5-sanitizers:
    name: Q-5 C over-read under sanitizers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sanitizers: asan msan
          - os: macos-latest
            sanitizers: asan
    runs-on: ${{ matrix.os }}
    env:
      SANITIZERS: ${{ matrix.sanitizers }}
      CC: clang
      OUT: ${{ github.workspace }}/q5-bin
    steps:
      - uses: actions/checkout@v4
      - run: clang --version
      - run: docs/evidence/q5/build.sh
      - run: docs/evidence/q5/run.sh
      - run: docs/evidence/q5/check.sh
      # Without MSan the checked-in msan.txt is the recorded Linux run; keep it
      # out of this OS's artifact.
      - if: ${{ always() && !contains(matrix.sanitizers, 'msan') }}
        run: rm -f docs/evidence/q5/msan.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q5-sanitizers-${{ runner.os }}
          path: |
            docs/evidence/q5/plain.txt
            docs/evidence/q5/asan.txt
            docs/evidence/q5/msan.txt

  coverage:
    name: coverage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # Full suite (both commands of the test job, no test skipped), pinned
      # stable toolchain, instrumented release build. Doctests are not in
      # this job: cargo-llvm-cov --doctests needs nightly, and nightly
      # coverage is not usable at present (docs/REPORT.md, "Coverage on every
      # CI platform"); `scripts/coverage.sh DIR nightly-doctests` and
      # `... nightly` measure them by hand.
      - run: scripts/coverage.sh coverage-out/stable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ runner.os }}
          path: coverage-out/
          if-no-files-found: error

  miri:
    name: miri (safe crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal -c miri,rust-src
      - run: cargo +nightly miri test -p expat --all-features
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  fuzz-smoke:
    name: fuzz smoke (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - run: scripts/fuzz-smoke.sh 60
