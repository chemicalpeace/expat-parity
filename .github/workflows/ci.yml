name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · debt · doc · deny · vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: scripts/debt-check.sh
      - run: scripts/verify-vendor.sh
      - run: python3 scripts/gen_tables.py --check
      - run: cargo doc --workspace --no-deps --all-features
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace --all-features
      - run: cargo test -p expat --no-default-features
      # D-034: the tracker's structure sizes against this platform's C
      # compiler, the DV-1 / R1 window boundaries and the per-event
      # comparison with C's tracker (creation, parse, release, limit
      # outcomes), printed for the per-platform report (all also run in
      # the step above).
      - name: tracker sizes, events and DV-1 windows (per-platform report)
        run: cargo test --release -p expat-difftest --test tracker_sizes --test tracker_events --test tracker_stages --test dv1_windows -- --nocapture
      # The namespaced-attribute duplicate-check scaling against C, printed
      # and kept as an artifact on success too (also runs in the first step).
      - name: ns duplicate-check scaling (per-platform report)
        shell: bash
        env:
          NS_SCALING_REPORT: ${{ github.workspace }}/ns-scaling-${{ matrix.os }}.json
        run: cargo test -p expat-difftest --test ns_atts_diff ns_duplicate_check_scales_like_c -- --nocapture --exact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ns-scaling-${{ matrix.os }}
          path: ns-scaling-${{ matrix.os }}.json
          if-no-files-found: error

  coverage:
    name: coverage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # Full suite (both commands of the test job, no test skipped), pinned
      # stable toolchain, instrumented release build. Doctests are not in
      # this job: cargo-llvm-cov --doctests needs nightly, and nightly
      # coverage is not usable at present (docs/REPORT.md, "Coverage on every
      # CI platform"); `scripts/coverage.sh DIR nightly-doctests` and
      # `... nightly` measure them by hand.
      - run: scripts/coverage.sh coverage-out/stable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ runner.os }}
          path: coverage-out/
          if-no-files-found: error

  miri:
    name: miri (safe crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal -c miri,rust-src
      - run: cargo +nightly miri test -p expat --all-features
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  fuzz-smoke:
    name: fuzz smoke (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - run: scripts/fuzz-smoke.sh 60
