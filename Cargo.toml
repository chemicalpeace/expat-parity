[workspace]
resolver = "3"
members = ["crates/expat", "crates/expat-oracle", "tests", "benches"]
default-members = ["crates/expat", "crates/expat-oracle", "tests", "benches"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/chemicalpeace/expat-parity"
publish = false

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[profile.release]
debug = 1

# The differential tests run the port, the harness and the C oracle millions
# of times; optimising these three crates in dev/test builds keeps the suite
# fast without changing what is checked (debug assertions and overflow checks
# stay on, D-022).
[profile.dev.package.expat]
opt-level = 2

[profile.dev.package.expat-difftest]
opt-level = 2

[profile.dev.package.expat-oracle]
opt-level = 2
