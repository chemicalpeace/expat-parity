[package]
name = "expat-capi"
description = "libexpat-compatible C interface (expat.h) over the expat crate; a first slice, see the crate documentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[features]
# libexpat's `XML_TESTING` hooks (`g_reparseDeferralEnabledDefault`,
# `g_bytesScanned`, `testingAccountingGetCountBytes*`), only for running
# libexpat's own test suite against this library
# (`scripts/runtests-check.sh`). Not part of the interface.
testing = []

[dependencies]
expat = { path = "../expat" }

[dev-dependencies]
# `internal-api` only for the layout the system allocator test exempts.
expat = { path = "../expat", features = ["internal-api"] }
